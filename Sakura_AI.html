<style>
:root{color-scheme:dark;--bg:#101014;--panel:#17171d;--panel2:#1e1e26;--panel3:#25252f;--border:#2c2c37;--text:#f4f1f4;--muted:#a19ca8;--pink:#ff83b7;--pink2:#ffb4d2;--pink-soft:rgba(255,131,183,.12);--sidebar:268px;--radius:16px}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.app{height:100dvh;display:flex;overflow:hidden}.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:#141419;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:17px 13px;transition:transform .25s,width .25s;z-index:20}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}.brand-mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#ffafd0,#f66da7);display:grid;place-items:center;color:#24121b;font-size:19px;box-shadow:0 4px 20px #ff83b72b}.brand-name{font-size:17px;font-weight:700;letter-spacing:-.5px}.brand-name span{color:var(--pink)}.icon-btn{width:36px;height:36px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;flex-shrink:0}.icon-btn:hover{background:var(--panel3);color:var(--text)}.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.new-chat{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border:1px solid #4a3440;border-radius:12px;background:linear-gradient(120deg,#33232d,#242029);font-weight:600;text-align:left;margin-bottom:18px}.new-chat:hover{border-color:var(--pink);background:#34232d}.new-chat svg{width:18px;height:18px;stroke:var(--pink);fill:none;stroke-width:2}.side-label{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;color:#77727e;padding:7px 9px 9px;font-weight:700}.history{overflow:auto;flex:1}.history-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:#c9c4ce;font-size:13px;cursor:pointer;min-width:0}.history-item:hover,.history-item.active{background:#24232b;color:#fff}.history-item .history-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.history-item .delete-chat{opacity:0}.history-item:hover .delete-chat{opacity:1}.history-item svg{width:15px;height:15px;stroke:currentColor;fill:none;flex-shrink:0}.sidebar-bottom{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}.profile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#ffafd0,#c75c94);display:grid;place-items:center;color:#24121b;font-weight:700}.profile-info{min-width:0;flex:1}.profile-info strong{font-size:13px;display:block}.profile-info small{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:62px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 25px;border-bottom:1px solid rgba(44,44,55,.7);background:rgba(16,16,20,.86);backdrop-filter:blur(16px);z-index:5}.top-left,.top-actions{display:flex;align-items:center;gap:10px}.mobile-brand{display:none;font-weight:700}.model-select{background:transparent;border:1px solid transparent;color:#e8e3eb;border-radius:9px;padding:8px 10px;font-size:13px;font-weight:600;cursor:pointer}.model-select:hover{background:var(--panel2);border-color:var(--border)}.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.status:before{content:"";width:6px;height:6px;background:#68d69b;border-radius:50%}.content{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}.conversation{max-width:900px;margin:0 auto;padding:35px 34px 28px}.welcome{min-height:calc(100dvh - 245px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:35px 0 50px}.welcome-mark{height:62px;width:62px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#ffb5d2,#f16ba4);font-size:32px;color:#29141f;box-shadow:0 10px 55px #ff83b72b;margin-bottom:22px}.welcome h1{font-size:clamp(29px,4vw,42px);letter-spacing:-1.8px;margin:0 0 10px}.welcome h1 span{background:linear-gradient(90deg,#ff83b7,#ffd1e4);background-clip:text;-webkit-background-clip:text;color:transparent}.welcome p{color:var(--muted);font-size:14px;margin:0 0 32px}.suggestions{width:min(100%,690px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;text-align:left}.suggestion{border:1px solid var(--border);background:linear-gradient(145deg,#1b1b23,#17171d);border-radius:14px;padding:15px;min-height:86px;transition:.2s}.suggestion:hover{border-color:#82506a;transform:translateY(-2px);background:#211c24}.suggestion strong{font-size:13px;display:block;margin-bottom:5px}.suggestion span{font-size:12px;color:var(--muted);line-height:1.45}.suggestion .s-icon{color:var(--pink);font-size:17px;margin-bottom:8px}
.message{display:flex;gap:13px;margin:0 auto 28px;max-width:100%;animation:appear .22s ease}.message.user{justify-content:flex-end}.message-avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#28232b;display:grid;place-items:center;color:var(--pink);font-size:15px;margin-top:2px}.message-body{min-width:0;max-width:calc(100% - 45px)}.user .message-body{max-width:min(78%,700px);background:#292630;border:1px solid #39333e;border-radius:18px 18px 5px 18px;padding:12px 16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:14px}.assistant .message-body{flex:1;max-width:100%;line-height:1.75;font-size:14px;color:#e9e5eb;overflow-wrap:anywhere}.assistant .message-body .katex{font-size:1.04em}.assistant .message-body .katex-display{overflow-x:auto;overflow-y:hidden;padding:5px 0;margin:12px 0}.assistant .message-body p{margin:0 0 13px}.assistant .message-body p:last-child{margin-bottom:0}.assistant .message-body h1,.assistant .message-body h2,.assistant .message-body h3,.assistant .message-body h4{line-height:1.3;letter-spacing:-.4px;margin:24px 0 11px;color:#fff}.assistant .message-body h1{font-size:25px}.assistant .message-body h2{font-size:21px}.assistant .message-body h3{font-size:17px}.assistant .message-body h4{font-size:15px}.assistant .message-body strong{font-weight:700;color:#fff}.assistant .message-body em{color:#f3dce7}.assistant .message-body a{color:var(--pink2);text-decoration:underline;text-underline-offset:3px}.assistant .message-body ul,.assistant .message-body ol{padding-left:24px;margin:9px 0 16px}.assistant .message-body li{padding-left:4px;margin:5px 0}.assistant .message-body blockquote{border-left:3px solid var(--pink);padding:5px 14px;margin:14px 0;color:#c7bfca;background:#1a171e;border-radius:0 9px 9px 0}.assistant .message-body hr{border:0;border-top:1px solid var(--border);margin:20px 0}.assistant .message-body :not(pre)>code{font-family:"JetBrains Mono",monospace;font-size:.88em;background:#292630;border:1px solid #393441;color:#ffc0d9;padding:2px 6px;border-radius:6px}.table-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--border);border-radius:10px}.assistant table{border-collapse:collapse;width:100%;font-size:13px;min-width:400px}.assistant th,.assistant td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left}.assistant th{background:#24212a;color:#ffd0e3;font-weight:600}.assistant tr:last-child td{border-bottom:0}
.code-block{margin:15px 0 18px;border:1px solid #383541;border-radius:12px;overflow:hidden;background:#111116}.code-head{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 11px 0 14px;background:#202027;border-bottom:1px solid #35323d;color:#bcb6c2;font-size:11px}.code-lang{display:flex;align-items:center;gap:8px}.code-dot{width:7px;height:7px;border-radius:50%;background:var(--pink)}.copy-code{border:1px solid #45404c;background:#2b2932;color:#e7e0e9;border-radius:7px;padding:5px 9px;font-size:11px;display:flex;align-items:center;gap:6px}.copy-code:hover{border-color:var(--pink);color:#fff}.copy-code svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}.code-block pre{margin:0;padding:16px;overflow:auto;max-height:600px;tab-size:2}.code-block pre code{font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.65;background:transparent!important;padding:0!important;border:0!important;color:#e8e5ed}
.message-actions{display:flex;align-items:center;gap:4px;margin-top:10px;opacity:.0;transition:opacity .15s}.message:hover .message-actions{opacity:1}.action-btn{border:0;background:transparent;color:#928b99;padding:6px 8px;border-radius:7px;font-size:11px;display:flex;align-items:center;gap:5px}.action-btn:hover{background:#282630;color:#fff}.action-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}.thinking{display:flex;gap:5px;padding:9px 0}.thinking i{width:6px;height:6px;background:var(--pink);border-radius:50%;animation:bounce 1s infinite}.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
.composer-wrap{padding:10px 24px 17px;background:linear-gradient(transparent,var(--bg) 17%);flex-shrink:0}.composer-inner{max-width:850px;margin:0 auto}.attachment-preview{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.attachment-chip{background:#27232c;border:1px solid #493342;border-radius:9px;padding:7px 10px;font-size:11px;color:#f4c7da;display:flex;gap:8px;align-items:center}.attachment-chip button{border:0;background:none;color:#c5a6b5}.composer{border:1px solid #3a3541;background:#1c1b22;border-radius:19px;padding:10px 11px 9px;box-shadow:0 10px 35px #0003;transition:border .2s}.composer:focus-within{border-color:#87516d;box-shadow:0 0 0 3px #ff83b70c,0 10px 35px #0003}.composer textarea{display:block;width:100%;resize:none;max-height:180px;min-height:31px;border:0;outline:0;background:transparent;color:var(--text);padding:5px 7px;font-size:14px;line-height:1.55}.composer textarea::placeholder{color:#827c89}.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 1px 0}.composer-tools,.composer-send{display:flex;align-items:center;gap:5px}.tool-btn{height:33px;padding:0 9px;border:1px solid transparent;border-radius:9px;background:transparent;color:#aaa3b0;font-size:11px;display:flex;align-items:center;gap:6px}.tool-btn:hover,.tool-btn.active{background:#302631;border-color:#624052;color:#ffc0d9}.tool-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}.send-btn{width:35px;height:35px;border:0;border-radius:11px;background:linear-gradient(145deg,#ffafd0,#f16ba4);color:#28141e;display:grid;place-items:center;box-shadow:0 4px 15px #ff83b72b}.send-btn:disabled{opacity:.4;cursor:not-allowed}.send-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}.stop-btn{background:#42303a;color:#ffc0d9}.composer-note{text-align:center;color:#77717d;font-size:10px;margin-top:9px}.hidden{display:none!important}
.popover{position:absolute;bottom:75px;left:0;background:#24222b;border:1px solid #46404d;border-radius:12px;padding:7px;min-width:210px;box-shadow:0 15px 45px #0008;z-index:30}.popover button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px;border-radius:8px;text-align:left;font-size:12px;color:#ddd}.popover button:hover{background:#34303a}.popover button span{color:var(--pink)}.tool-area{position:relative}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:60;display:grid;place-items:center;padding:20px}.modal{width:min(480px,100%);background:#1c1b22;border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 20px 80px #0009}.modal h2{font-size:18px;margin:0 0 17px}.modal label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}.modal input,.modal select{width:100%;background:#111116;border:1px solid var(--border);border-radius:9px;padding:10px;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary-btn,.primary-btn{border-radius:9px;padding:9px 14px;font-size:12px;border:1px solid var(--border);background:#292630}.primary-btn{background:var(--pink);border-color:var(--pink);color:#21121a;font-weight:700}.toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#302a34;border:1px solid #514252;color:#fff;border-radius:10px;padding:10px 15px;font-size:12px;z-index:100;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:280px;box-shadow:20px 0 50px #0008}.sidebar.open{transform:translateX(0)}.mobile-brand{display:block}.topbar{padding:0 13px;height:57px}.conversation{padding:24px 17px}.composer-wrap{padding:8px 12px 12px}.status{display:none}.welcome{min-height:calc(100dvh - 220px)}.message-actions{opacity:1}.suggestions{grid-template-columns:1fr}.user .message-body{max-width:88%}.tool-btn .tool-text{display:none}.tool-btn{padding:0 8px}.composer{border-radius:16px}}
@media(min-width:761px){.sidebar.collapsed{width:0;flex-basis:0;padding-left:0;padding-right:0;overflow:hidden;border:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">✿</div><div class="brand-name">Sakura <span>AI</span></div></div>
    <button class="new-chat" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div class="side-label">Your conversations</div>
    <div class="history" id="historyList"></div>
    <div class="sidebar-bottom">
      <div class="history-item" id="openSettings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</div>
      <div class="profile"><div class="avatar">S</div><div class="profile-info"><strong>Sakura AI</strong><small>Personal assistant</small></div><button class="icon-btn" id="apiKeyBtn" title="API key"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 3 3-2 2-2-2-2 2 2 2-3 3"/></svg></button></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="top-left"><button class="icon-btn" id="sidebarToggle" title="Toggle sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button><span class="mobile-brand">Sakura <span style="color:var(--pink)">AI</span></span><select class="model-select" id="modelSelect" aria-label="AI model"><option value="gemini-3.8-flash">Gemini 3.8 Flash · Fast</option><option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview · Advanced</option><option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite · Lightweight</option></select><span class="status">Ready</span></div>
      <div class="top-actions"><button class="icon-btn" id="exportBtn" title="Export conversation"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></button><button class="icon-btn" id="topSettings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
    </header>
    <section class="content" id="content"><div class="conversation" id="conversation"></div></section>
    <footer class="composer-wrap">
      <div class="composer-inner">
        <div class="attachment-preview" id="attachmentPreview"></div>
        <form class="composer" id="chatForm">
          <textarea id="promptInput" rows="1" placeholder="Message Sakura..." aria-label="Message Sakura"></textarea>
          <div class="composer-bottom">
            <div class="composer-tools">
              <div class="tool-area"><button type="button" class="tool-btn" id="attachBtn" title="Attach a file"><svg viewBox="0 0 24 24"><path d="m20.5 11.5-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg><span class="tool-text">Attach</span></button><input id="fileInput" type="file" hidden multiple accept="image/*,.txt,.md,.js,.ts,.py,.html,.css,.json,.csv,.xml,.yaml,.yml,.log">
              </div>
              <button type="button" class="tool-btn" id="searchToggle" title="Use Google Search grounding"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><span class="tool-text">Search</span></button>
              <button type="button" class="tool-btn" id="voiceBtn" title="Voice input"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4m-4 0h8"/></svg><span class="tool-text">Voice</span></button>
            </div>
            <div class="composer-send"><button class="send-btn" id="sendBtn" type="submit" title="Send message"><svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1zM12 13l7-8"/></svg></button></div>
          </div>
        </form>
        <div class="composer-note">Sakura AI can make mistakes. Check important information.</div>
      </div>
    </footer>
  </main>
</div>
<div class="modal-backdrop hidden" id="settingsModal"><div class="modal"><h2>Settings</h2><label for="apiKey">Google AI Studio API key</label><input id="apiKey" type="password" placeholder="Paste your API key" autocomplete="off"><div style="display:flex;gap:10px;align-items:center;margin:10px 0 18px"><button class="secondary-btn" id="refreshModels" type="button">Refresh available models</button><span id="modelStatus" style="font-size:11px;color:var(--muted)">Loads models enabled for your API key</span></div><label for="temperature">Creativity · <span id="temperatureValue">0.8</span></label><input id="temperature" type="range" min="0" max="2" step=".1" value=".8"><label for="maxTokens">Maximum response length</label><select id="maxTokens"><option value="4096">4,096 tokens</option><option value="8192" selected>8,192 tokens</option><option value="16384">16,384 tokens</option></select><div class="modal-actions"><button class="secondary-btn" id="closeSettings">Close</button><button class="primary-btn" id="saveSettings">Save settings</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const form=$('chatForm'), input=$('promptInput'), conversation=$('conversation'), content=$('content');
  const STORE='sakura_ai_chats_v2', SETTINGS='sakura_ai_settings_v2';
  let chats=loadChats(), currentId=null, useSearch=false, attachments=[], lastPrompt='', lastAssistantNode=null;
  // Each conversation owns its own request/controller, so switching chats never cancels or loses a response.
  const generations=new Map();
  let settings=loadSettings();
  chats.forEach(c=>{if(c.generating){c.generating=false;c.messages.push({role:'model',text:'*Generation was interrupted when Sakura AI was closed or refreshed. Please resend your last message to continue.*'});}});
  if(chats.some(c=>!c.generating)) { try{localStorage.setItem(STORE,JSON.stringify(chats))}catch{} }
  const iconCopy='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>';
  function loadChats(){try{return JSON.parse(localStorage.getItem(STORE)||'[]')}catch{return []}}
  function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS)||'{}')}catch{return {}}}
  function saveChats(){localStorage.setItem(STORE,JSON.stringify(chats))}
  function saveSettings(){localStorage.setItem(SETTINGS,JSON.stringify(settings))}
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2200)}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function activeChat(){return chats.find(c=>c.id===currentId)}
  function titleFrom(text){return text.replace(/\s+/g,' ').slice(0,42)+(text.length>42?'…':'')}
  function renderHistory(){
    const list=$('historyList');list.innerHTML='';
    [...chats].sort((a,b)=>b.updated-a.updated).forEach(chat=>{
      const row=document.createElement('div');row.className='history-item'+(chat.id===currentId?' active':'');
      row.innerHTML='<svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-1-4a7.5 7.5 0 1 1 16-3.5z"/></svg><span class="history-title"></span><button class="icon-btn delete-chat" title="Delete chat"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>';
      row.querySelector('.history-title').textContent=chat.title||'New conversation';
      row.addEventListener('click',e=>{if(e.target.closest('.delete-chat'))return;openChat(chat.id)});
      row.querySelector('.delete-chat').addEventListener('click',e=>{e.stopPropagation();if(confirm('Delete this conversation?')){chats=chats.filter(c=>c.id!==chat.id);saveChats();if(currentId===chat.id)newChat();else renderHistory()}});
      list.appendChild(row);
    });
  }
  function newChat(){currentId=uid();chats.unshift({id:currentId,title:'New conversation',updated:Date.now(),messages:[]});saveChats();renderHistory();renderConversation();updateSendButton();input.focus();closeSidebarMobile()}
  function openChat(id){currentId=id;renderHistory();renderConversation();updateSendButton();closeSidebarMobile()}
  function closeSidebarMobile(){if(innerWidth<=760)$('sidebar').classList.remove('open')}
  function welcomeMarkup(){return `<div class="welcome"><div class="welcome-mark">✿</div><h1>What can I help you <span>create?</span></h1><p>Your ideas, questions, and projects start here.</p><div class="suggestions"><button class="suggestion" data-prompt="Write a clean, well-commented JavaScript function that..."><div class="s-icon">⌘</div><strong>Write some code</strong><span>Build, debug, or explain a piece of code</span></button><button class="suggestion" data-prompt="Explain this topic in a simple way, with examples: "><div class="s-icon">✧</div><strong>Learn something</strong><span>Break down a complicated topic</span></button><button class="suggestion" data-prompt="Help me brainstorm creative ideas for..."><div class="s-icon">◇</div><strong>Brainstorm ideas</strong><span>Explore possibilities and get inspired</span></button><button class="suggestion" data-prompt="Create a step-by-step plan for..."><div class="s-icon">↗</div><strong>Make a plan</strong><span>Turn a goal into actionable steps</span></button></div></div>`}
  function renderConversation(){
    const chat=activeChat();conversation.innerHTML='';
    if(!chat||!chat.messages.length){conversation.innerHTML=welcomeMarkup();conversation.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{input.value=b.dataset.prompt;input.focus();autoResize()}));}
    else chat.messages.forEach((m,i)=>appendMessage(m.text,m.role,false,i));
    if(generations.has(currentId)) addThinking();
    scrollBottom();updateSendButton();
  }
  function appendMessage(text,role,save=true,index=null){
    const wrapper=document.createElement('article');wrapper.className='message '+(role==='user'?'user':'assistant');
    if(role==='user'){
      const body=document.createElement('div');body.className='message-body';body.textContent=text;wrapper.appendChild(body);
    }else{
      const av=document.createElement('div');av.className='message-avatar';av.textContent='✿';wrapper.appendChild(av);
      const body=document.createElement('div');body.className='message-body';body.innerHTML=renderMarkdown(text);wrapper.appendChild(body);
      if(window.renderMathInElement){renderMathInElement(body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false,strict:'ignore'});}
      body.querySelectorAll('pre code').forEach(code=>{if(window.hljs)hljs.highlightElement(code);});
      body.querySelectorAll('pre').forEach(pre=>{
        const code=pre.querySelector('code');if(!code||pre.parentElement.classList.contains('code-block'))return;
        const lang=(code.className.match(/language-([\w+-]+)/)||[])[1]||'Code';
        const block=document.createElement('div');block.className='code-block';
        const head=document.createElement('div');head.className='code-head';
        const langLabel=document.createElement('span');langLabel.className='code-lang';langLabel.innerHTML='<i class="code-dot"></i>';langLabel.append(document.createTextNode(lang));
        const copy=document.createElement('button');copy.className='copy-code';copy.innerHTML=iconCopy+' Copy';copy.addEventListener('click',()=>copyText(code.innerText,copy));
        head.append(langLabel,copy);pre.parentNode.insertBefore(block,pre);block.append(head,pre);
      });
      body.querySelectorAll('table').forEach(table=>{const wrap=document.createElement('div');wrap.className='table-wrap';table.parentNode.insertBefore(wrap,table);wrap.appendChild(table)});
      const actions=document.createElement('div');actions.className='message-actions';
      actions.innerHTML=`<button class="action-btn copy-answer">${iconCopy} Copy</button><button class="action-btn regenerate"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg> Regenerate</button>`;
      actions.querySelector('.copy-answer').addEventListener('click',e=>copyText(text,e.currentTarget));
      actions.querySelector('.regenerate').addEventListener('click',()=>regenerate());
      body.appendChild(actions);lastAssistantNode=wrapper;
    }
    conversation.appendChild(wrapper);
    if(save&&activeChat()){activeChat().messages.push({role,text});activeChat().updated=Date.now();saveChats();renderHistory()}
    return wrapper;
  }
  function renderMarkdown(raw){
    if(!window.marked)return escapeHTML(raw).replace(/\n/g,'<br>');
    marked.setOptions({gfm:true,breaks:true});
    const renderer=new marked.Renderer();
    renderer.code=(code,infostring)=>{const lang=(infostring||'').split(/\s+/)[0];const cls=lang?'language-'+lang:'';return `<pre><code class="${cls}">${escapeHTML(code)}</code></pre>`};
    const dirty=marked.parse(raw,{renderer});
    return DOMPurify.sanitize(dirty,{USE_PROFILES:{html:true},ADD_ATTR:['target']});
  }
  function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  async function copyText(text,button){try{await navigator.clipboard.writeText(text);if(button){const old=button.innerHTML;button.textContent='✓ Copied';setTimeout(()=>button.innerHTML=old,1400)}else toast('Copied to clipboard')}catch{toast('Clipboard access was blocked')}}
  function scrollBottom(){content.scrollTop=content.scrollHeight}
  function autoResize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px'}
  function updateSendButton(){
    const running=generations.has(currentId), btn=$('sendBtn');
    btn.disabled=false;btn.classList.toggle('stop-btn',running);
    btn.innerHTML=running?'<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>':'<svg viewBox="0 0 24 24"><path d="m5 12 14-7-4 14-3-6-7-1zM12 13l7-8"/></svg>';
    btn.title=running?'Stop generating':'Send message';
  }
  function stopGeneration(id=currentId){
    const job=generations.get(id);if(!job)return;
    job.controller.abort();generations.delete(id);
    const chat=chats.find(c=>c.id===id);
    if(chat){chat.generating=false;saveChats()}
    if(id===currentId){$('thinkingMessage')?.remove();updateSendButton()}
    toast('Generation stopped');
  }
  function addThinking(){const w=document.createElement('article');w.className='message assistant';w.id='thinkingMessage';w.innerHTML='<div class="message-avatar">✿</div><div class="message-body"><div class="thinking"><i></i><i></i><i></i></div></div>';conversation.appendChild(w);scrollBottom();return w}
  function fileToPart(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const data=String(r.result).split(',')[1];resolve({inlineData:{mimeType:file.type||'application/octet-stream',data}})};r.onerror=reject;r.readAsDataURL(file)})}
  async function sendMessage(promptOverride=null){
    if(generations.has(currentId)){stopGeneration(currentId);return}
    const prompt=(promptOverride??input.value).trim();if(!prompt&&!attachments.length)return;
    const apiKey=settings.apiKey||'';if(!apiKey){openSettings();toast('Add your Google AI Studio API key to get started');return}
    if(!currentId)newChat();
    const chatId=currentId, chat=chats.find(c=>c.id===chatId);
    const userText=prompt+(attachments.length?'\\n\\nAttached: '+attachments.map(a=>a.name).join(', '):'');
    if(!chat.messages.length)chat.title=titleFrom(prompt||attachments[0]?.name||'New conversation');
    chat.messages.push({role:'user',text:userText});chat.updated=Date.now();saveChats();renderHistory();
    const files=[...attachments];attachments=[];renderAttachments();input.value='';autoResize();
    const controller=new AbortController();
    generations.set(chatId,{controller});chat.generating=true;saveChats();
    if(chatId===currentId){addThinking();updateSendButton()}
    try{
      const contents=[];
      for(const m of chat.messages){if(m.role==='user')contents.push({role:'user',parts:[{text:m.text}]});else if(m.role==='model')contents.push({role:'model',parts:[{text:m.text}]})}
      const parts=[];if(prompt)parts.push({text:prompt});
      for(const f of files){if(f.file.type.startsWith('image/'))parts.push(await fileToPart(f.file));else parts.push({text:`\\n\\n[Attached file: ${f.name}]\\n${f.text||''}`})}
      // Replace the last text-only user turn with multimodal parts when files were attached.
      if(files.length) contents[contents.length-1]={role:'user',parts:[...(prompt?[{text:prompt}]:[]),...await Promise.all(files.map(async f=>f.file.type.startsWith('image/')?await fileToPart(f.file):{text:`\\n\\n[Attached file: ${f.name}]\\n${f.text||''}`}))]};
      const generationConfig={temperature:Number(settings.temperature??.8),topP:.95,maxOutputTokens:Number(settings.maxTokens||8192)};
      const body={contents,generationConfig};
      if(useSearch)body.tools=[{google_search:{}}];
      const model=$('modelSelect').value;
      const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify(body),signal:controller.signal});
      const data=await response.json();
      if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);
      const candidate=data.candidates?.[0];const reply=(candidate?.content?.parts||[]).filter(p=>typeof p.text==='string').map(p=>p.text).join('');
      if(!reply)throw new Error(candidate?.finishReason?`No text returned (${candidate.finishReason})`:'Gemini returned an empty response.');
      const target=chats.find(c=>c.id===chatId);
      if(target){target.messages.push({role:'model',text:reply});target.updated=Date.now();saveChats();renderHistory()}
      if(useSearch&&candidate.groundingMetadata?.searchEntryPoint)toast('Response used Google Search grounding');
    }catch(err){
      if(err.name!=='AbortError'){
        const target=chats.find(c=>c.id===chatId);
        if(target){target.messages.push({role:'model',text:'**Something went wrong.**\\n\\n'+err.message});target.updated=Date.now();saveChats();renderHistory()}
        console.error('Sakura AI:',err);
      }
    }finally{
      generations.delete(chatId);
      const target=chats.find(c=>c.id===chatId);if(target){target.generating=false;saveChats()}
      if(chatId===currentId){$('thinkingMessage')?.remove();renderConversation();updateSendButton();input.focus()}
    }
  }
  function regenerate(){
    const chat=activeChat();if(!chat||generations.has(currentId))return;
    let lastUser=-1;for(let i=chat.messages.length-1;i>=0;i--)if(chat.messages[i].role==='user'){lastUser=i;break}
    if(lastUser<0)return;const prompt=chat.messages[lastUser].text;
    chat.messages=chat.messages.slice(0,lastUser);saveChats();renderConversation();sendMessage(prompt);
  }
  function renderAttachments(){
    const box=$('attachmentPreview');box.innerHTML='';
    attachments.forEach((a,i)=>{const chip=document.createElement('div');chip.className='attachment-chip';chip.textContent='▧ '+a.name;const x=document.createElement('button');x.textContent='×';x.onclick=()=>{attachments.splice(i,1);renderAttachments()};chip.appendChild(x);box.appendChild(chip)});
  }
  $('newChat').onclick=newChat;$('sidebarToggle').onclick=()=>{if(innerWidth<=760)$('sidebar').classList.toggle('open');else $('sidebar').classList.toggle('collapsed')};
  $('chatForm').addEventListener('submit',e=>{e.preventDefault();sendMessage()});
  input.addEventListener('input',autoResize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage()}});
  $('sendBtn').onclick=()=>{if(generations.has(currentId))stopGeneration(currentId);else sendMessage()};
  $('attachBtn').onclick=()=>$('fileInput').click();
  $('fileInput').onchange=async e=>{for(const file of [...e.target.files]){if(file.size>12*1024*1024){toast(file.name+' is larger than 12 MB');continue}let text='';if(!file.type.startsWith('image/')){try{text=await file.text()}catch{}}attachments.push({name:file.name,file,text})}renderAttachments();e.target.value=''};
  $('searchToggle').onclick=()=>{useSearch=!useSearch;$('searchToggle').classList.toggle('active',useSearch);toast(useSearch?'Google Search grounding enabled':'Google Search grounding disabled')};
  $('voiceBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Voice input is not supported in this browser');return}const rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=false;rec.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript;autoResize();input.focus()};rec.onerror=()=>toast('Voice input could not start');rec.start();toast('Listening…')};
  $('exportBtn').onclick=()=>{const chat=activeChat();if(!chat||!chat.messages.length){toast('There is no conversation to export');return}const md=chat.messages.map(m=>(m.role==='user'?'## You':'## Sakura AI')+'\n\n'+m.text).join('\n\n---\n\n');const blob=new Blob([`# ${chat.title}\n\n${md}`],{type:'text/markdown'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(chat.title||'sakura-chat').replace(/[^\w-]+/g,'-')+'.md';a.click();URL.revokeObjectURL(a.href)};
  const fallbackModels=[
    {id:'gemini-3.8-flash',name:'Gemini 3.8 Flash'},
    {id:'gemini-3.1-pro-preview',name:'Gemini 3.1 Pro Preview'},
    {id:'gemini-3.5-flash-lite',name:'Gemini 3.5 Flash-Lite'}
  ];
  async function refreshModels(){
    const key=($('apiKey').value||settings.apiKey||'').trim();
    if(!key){$('modelStatus').textContent='Enter your API key first';return}
    const button=$('refreshModels');button.disabled=true;$('modelStatus').textContent='Checking models available to your key…';
    try{
      let token='',models=[],pages=0;
      do{
        const url=new URL('https://generativelanguage.googleapis.com/v1beta/models');
        url.searchParams.set('pageSize','1000');if(token)url.searchParams.set('pageToken',token);
        const response=await fetch(url,{headers:{'x-goog-api-key':key}});
        const data=await response.json();
        if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);
        models.push(...(data.models||[]));token=data.nextPageToken||'';pages++;
      }while(token&&pages<10);
      const usable=models.filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent'))
        .map(m=>({id:(m.name||'').replace(/^models\//,''),name:m.displayName||m.name}))
        .filter(m=>m.id&&!/embedding|aqa|deprecated|tuning/i.test(m.id+' '+m.name))
        .sort((a,b)=>a.name.localeCompare(b.name));
      if(!usable.length)throw new Error('Google returned no models supporting generateContent for this API key.');
      const select=$('modelSelect'),previous=select.value||settings.model;
      select.innerHTML='';
      usable.forEach(m=>{const option=document.createElement('option');option.value=m.id;option.textContent=m.name+' · '+m.id;select.appendChild(option)});
      select.value=usable.some(m=>m.id===previous)?previous:usable.find(m=>/flash/i.test(m.id))?.id||usable[0].id;
      settings.model=select.value;saveSettings();
      $('modelStatus').textContent=`Found ${usable.length} models supported by your API key`;
      toast(`Loaded ${usable.length} Gemini models`);
    }catch(error){$('modelStatus').textContent='Could not load models: '+error.message;toast('Model list could not be refreshed')}
    finally{button.disabled=false}
  }
  function openSettings(){$('apiKey').value=settings.apiKey||'';$('temperature').value=settings.temperature??.8;$('temperatureValue').textContent=$('temperature').value;$('maxTokens').value=settings.maxTokens||8192;$('settingsModal').classList.remove('hidden')}
  $('openSettings').onclick=openSettings;$('topSettings').onclick=openSettings;$('apiKeyBtn').onclick=openSettings;$('closeSettings').onclick=()=>$('settingsModal').classList.add('hidden');
  $('saveSettings').onclick=()=>{settings={...settings,apiKey:$('apiKey').value.trim(),temperature:$('temperature').value,maxTokens:$('maxTokens').value,model:$('modelSelect').value};saveSettings();$('settingsModal').classList.add('hidden');toast('Settings saved')};
  $('refreshModels').onclick=refreshModels;
  $('modelSelect').addEventListener('change',()=>{settings.model=$('modelSelect').value;saveSettings()});
  $('temperature').oninput=e=>$('temperatureValue').textContent=e.target.value;
  $('settingsModal').addEventListener('click',e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.add('hidden')});
  $('modelSelect').value=settings.model||'gemini-3.8-flash';
  if(settings.apiKey)refreshModels();
  if(!chats.length){newChat()}else{currentId=[...chats].sort((a,b)=>b.updated-a.updated)[0].id;renderHistory();renderConversation()}
})();
</script>
</body>
